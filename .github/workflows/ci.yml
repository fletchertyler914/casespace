name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.19.0"

jobs:
  quality:
    name: Lint, Types, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            build-essential

      - name: Architecture guard
        run: pnpm arch:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Desktop unit and component tests
        run: pnpm test:desktop

      - name: Parity integration tests
        run: pnpm test:parity

      - name: Hardening integration tests
        run: pnpm test:hardening

      - name: Build apps and packages
        run: pnpm turbo run build --filter=!desktop-backend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/desktop

      - name: Desktop UI E2E (mocked Tauri)
        run: pnpm test:e2e
        working-directory: apps/desktop

  desktop-auto-build:
    name: Desktop Auto Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop-backend/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop frontend
        run: pnpm --filter desktop build

      - name: Build tauri app (no publish)
        run: pnpm --filter desktop-backend tauri build
