name: Promote RC to Prod

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Existing RC tag (example: v1.2.0-rc.1)"
        required: true
      prod_tag:
        description: "New production tag (example: v1.2.0)"
        required: true

permissions:
  actions: write
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    env:
      # Use a PAT with `repo` + `workflow` scope when available.
      # Falls back to GITHUB_TOKEN for repos that do not require workflow-scope pushes.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve RC commit
        id: rc
        shell: bash
        run: |
          set -euo pipefail
          RC_COMMIT="$(git rev-list -n 1 "${{ github.event.inputs.rc_tag }}")"
          if [[ -z "$RC_COMMIT" ]]; then
            echo "Unable to resolve RC tag commit."
            exit 1
          fi
          echo "commit=$RC_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Create and push production tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ github.event.inputs.prod_tag }}" "${{ steps.rc.outputs.commit }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" "${{ github.event.inputs.prod_tag }}"

      - name: Trigger release workflow for production tag
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run "Release" --ref "${{ github.event.inputs.prod_tag }}" -f tag="${{ github.event.inputs.prod_tag }}"
