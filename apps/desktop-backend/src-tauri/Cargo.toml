[package]
name = "desktop-backend"
version = "0.1.12"
description = "CaseSpace native desktop backend"
authors = ["Tyler Fletcher <fletchertyler914@yahoo.com>"]
license = "BUSL-1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
dotenvy = "0.15.7"
pdf-extract = "0.10.0"
calamine = "0.35.0"
csv = "1.4.0"
encoding_rs = "0.8.35"
zip = "8.6.0"
quick-xml = "0.40.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
docx-rs = "0.4.20"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }

